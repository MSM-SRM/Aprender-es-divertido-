name: Probar voz Piper Davefx

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Piper y FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      - name: Generar dos muestras Davefx
        run: |
          python peques/puzzle-comunidades/audio/es/generate_samples.py

      - name: Publicar las muestras MP3
        uses: actions/upload-artifact@v4
        with:
          name: muestras-piper-davefx
          path: peques/puzzle-comunidades/audio/es/muestras-davefx/*.mp3
          if-no-files-found: error
          retention-days: 7
