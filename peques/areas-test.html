<html lang="es">
<head>

<style>
*{box-sizing:border-box}:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#18365e;background:#eaf7ff}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 5%,#fff 0,transparent 42%),linear-gradient(145deg,#e2f4ff,#f7f0ff 55%,#fff4dd);padding:clamp(14px,4vw,42px)}button{font:inherit;touch-action:manipulation;cursor:pointer}.wrap{width:min(100%,920px);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(18px,4vw,32px)}.back{border:2px solid #b9d9f5;border-radius:999px;background:#fff;color:#24558d;padding:10px 16px;font-weight:800;box-shadow:0 4px 12px #24558d18}.scores{display:flex;align-items:center;gap:7px}.score{display:flex;align-items:center;gap:5px;border:2px solid;border-radius:999px;background:#fff;padding:8px 11px;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px #24558d12}.score .star{font-size:1.25rem;line-height:1}.score.gold{border-color:#ffd967;background:#fff9df;color:#735515}.score.silver{border-color:#c4d3e2;background:#f5f9ff;color:#52677c}.score.bronze{border-color:#d9a27c;background:#fff3eb;color:#86502d}h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1;margin:0;color:#27637c;text-shadow:0 2px #fff}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:15px;margin-top:clamp(18px,3vw,28px)}.module{min-height:215px;text-align:center;padding:26px 18px;border:3px solid #fff;border-radius:24px;background:linear-gradient(145deg,#fff,#e7f4ff);box-shadow:0 9px 23px #23456b18;color:#193e69;transition:transform .16s,box-shadow .16s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.module:hover,.module:focus-visible{transform:translateY(-3px);box-shadow:0 14px 27px #23456b26;outline:3px solid #5aa9ee;outline-offset:2px}.module:nth-child(1){background:linear-gradient(145deg,#fff8d9,#ffe9a5)}.module:nth-child(2){background:linear-gradient(145deg,#e9fff0,#c9f0d5)}.module:nth-child(3){background:linear-gradient(145deg,#f2ebff,#dcd0ff)}.emoji{display:block;font-size:clamp(3.4rem,8vw,5rem);line-height:1}.module strong{display:block;font-size:clamp(1.35rem,3vw,1.8rem)}.play{display:none;margin-top:22px;padding:clamp(18px,4vw,30px);border:3px solid #fff;border-radius:28px;background:#ffffffdf;box-shadow:0 10px 28px #23456b18}.play.active{display:block}.play h2{font-size:clamp(1.3rem,4vw,1.8rem);margin:0}.hint{color:#526c89}.prompt{max-width:680px;margin:20px auto;padding:clamp(18px,4vw,32px);border-radius:24px;background:linear-gradient(145deg,#f0f7ff,#e7fff2);text-align:center;color:#1d4e70}.question{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:1000;line-height:1.2}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:620px;margin:18px auto}.answer{min-height:68px;border:3px solid #d8e9f8;border-radius:18px;background:#fff;color:#1c4c83;font-size:clamp(1.1rem,3.5vw,1.5rem);font-weight:900;padding:10px}.answer:hover,.answer:focus-visible{border-color:#4798e3;outline:3px solid #4798e355}.feedback{text-align:center;font-size:1.15rem;font-weight:900;min-height:34px;margin:20px 0 8px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.action{border:0;border-radius:999px;padding:11px 18px;background:#216eb6;color:#fff;font-weight:900}.action.alt{background:#edf4fb;color:#31577e}.action:disabled{opacity:.5;cursor:default}.foot{text-align:center;color:#617790;font-size:.85rem;margin-top:24px}@media(max-width:520px){.top{align-items:flex-start;gap:7px}.back{padding:9px 10px;font-size:.9rem}.scores{gap:4px}.score{padding:7px 8px;gap:3px;font-size:.85rem}.score .star{font-size:1rem}.module{min-height:170px}.answers{gap:8px}.answer{min-height:58px}}
.scene-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;max-width:760px;margin:18px auto}.scene-card,.character-card{min-height:140px;border:3px solid #d8e9f8;border-radius:20px;background:#fff;color:#1c4c83;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;box-shadow:0 5px 14px #23456b12}.scene-card:hover,.scene-card:focus-visible,.character-card:hover,.character-card:focus-visible{border-color:#4798e3;outline:3px solid #4798e355}.scene-card:disabled{opacity:.58;background:#e7f7ed;border-color:#8bd0a1}.scene-icon,.character-icon{font-size:2.5rem;line-height:1}.scene-card small,.character-card small{font-size:.9rem;line-height:1.35}.character-card{min-height:120px}.character-card strong{font-size:1.15rem}.module-link{font:inherit;text-decoration:none;cursor:pointer}.module-link small{color:#5a7290;font-size:.8rem;font-weight:800}.story-text{max-width:700px;margin:18px auto;padding:clamp(18px,4vw,30px);border-radius:22px;background:linear-gradient(145deg,#fff9e8,#fff);font-size:clamp(1.1rem,2.5vw,1.3rem);line-height:1.7;color:#3d4f68;text-align:left}.story-count{text-align:center;color:#627993;font-weight:800;margin:0 0 8px}@media(max-width:520px){.scene-grid{grid-template-columns:1fr}.scene-card{min-height:105px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><button class="back" id="backToMap">← Volver al mapa</button><div class="scores" aria-label="Estrellas acumuladas"><div class="score gold" aria-label="Estrellas doradas"><span class="star">★</span><span id="goldScore">000</span></div><div class="score silver" aria-label="Estrellas plateadas"><span class="star">★</span><span id="silverScore">000</span></div><div class="score bronze" aria-label="Estrellas de bronce"><span class="star">★</span><span id="bronzeScore">000</span></div></div></header>
<h1 id="areaTitle">Área</h1><section class="modules" id="modules" aria-label="Juegos de aprendizaje"></section>

<p class="foot">El progreso se guarda por perfil en este dispositivo.</p>
</main><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),profileId=params.get('profile')||'mireia';
const areaCatalog={
 ciencias:{title:'Ciencias',key:'ciencias',modules:[

  {mode:'ritmo',title:'Ritmo',emoji:'🥁',questions:[['¿Qué podemos usar para marcar un ritmo?',['Palmas','Un cojín','Una cuchara de helado','Un libro cerrado'],'Palmas'],['¿Qué palabra repetida suena como un ritmo?',['Tum, tum, pa','Azul, ventana, quizá','Mesa, nube, ayer','Lápiz, verde, sol'],'Tum, tum, pa']]},
  {mode:'sonidos',title:'Sonidos',emoji:'🎵',questions:[['¿Qué indica que una nota suena más aguda?',['Suena más alta','Suena más larga','Suena más despacio','No se oye'],'Suena más alta'],['¿Qué instrumento se toca soplando?',['Flauta','Tambor','Guitarra','Piano'],'Flauta']]},
  {mode:'cristic-musica',kind:'external',title:'Piano y juegos musicales · Cristic',emoji:'🎹',url:'https://www.cristic.com/1o-y-2o-de-primaria/musica/'}
 ]},
 biblioteca:{title:'Biblioteca Cuentos',key:'biblioteca',modules:[
  {mode:'mundo-primaria',kind:'external',title:'Cuentos clásicos',emoji:'📚',url:'https://www.mundoprimaria.com/cuentos-infantiles-cortos'},
  {mode:'arbol-abc',kind:'external',title:'Lecturas cortas',emoji:'🌳',url:'https://arbolabc.com/lecturas-cortas-para-ni%C3%B1os'},
  {mode:'caperucita-reto',kind:'storyQuiz',title:'Caperucita: cuento y reto',emoji:'🧺',story:'Un día, la mamá de Caperucita le pidió llevar una cesta con comida a su abuela, que vivía al otro lado del bosque. Le recordó que siguiera el camino. En el bosque, Caperucita se encontró con un lobo que le preguntó adónde iba. El lobo llegó antes a la casa de la abuela. Cuando Caperucita entró, notó que su abuela tenía una voz y unas orejas muy grandes. Una leñadora que pasaba cerca oyó el alboroto y entró a ayudar. Al final, Caperucita y su abuela pudieron compartir la merienda.',questions:[
   ['¿Adónde llevaba Caperucita la cesta?',['A casa de su abuela','A la escuela','Al mercado','A casa de los tres cerditos'],'A casa de su abuela'],
   ['¿Qué llevaba en la cesta?',['Comida','Juguetes','Libros','Flores'],'Comida'],
   ['¿Qué le recordó su mamá?',['Que siguiera el camino','Que corriera por el bosque','Que escondiera la cesta','Que volviera a casa'],'Que siguiera el camino'],
   ['¿Quién llegó antes a la casa de la abuela?',['El lobo','Caperucita','La leñadora','Un cazador'],'El lobo'],
   ['¿Quién oyó el alboroto y entró a ayudar?',['Una leñadora','Un panadero','Un jardinero','Un marinero'],'Una leñadora']
  ]}
 ]},
 'mitologia-griega':{title:'Mitología Griega',key:'mitologia_griega',modules:[
  {mode:'relatos-orden',kind:'sequence',title:'Relatos ilustrados',emoji:'📜',stories:[
   {title:'Zeus y los cíclopes ancianos',scenes:[['⛓️','Cronos, un Titán, mantiene encerrados a los cíclopes ancianos.'],['🔓','Zeus los libera antes de enfrentarse a los Titanes.'],['⚡','Los cíclopes forjan el rayo que ayuda a Zeus.']]},
   {title:'Odiseo y Polifemo',scenes:[['🐑','Odiseo y sus compañeros quedan dentro de la cueva de Polifemo.'],['🧠','Odiseo idea un plan para salir sin revelar su nombre.'],['🌅','El grupo escapa de la cueva escondido bajo las ovejas.']]}
  ]},
  {mode:'cartas-personajes',kind:'characters',title:'Cartas de personajes',emoji:'🃏',characters:[
   {name:'Zeus',emoji:'⚡',group:'Aliado · dios olímpico',clue:'Dios del rayo que libera a los cíclopes ancianos.'},
   {name:'Cronos',emoji:'⌛',group:'Rival · Titán',clue:'Titán que encerró a los cíclopes ancianos.'},
   {name:'Polifemo',emoji:'👁️',group:'Rival · cíclope',clue:'Gigante de un solo ojo que vive en una cueva y se encuentra con Odiseo.'},
   {name:'Odiseo',emoji:'⛵',group:'Héroe · aliado',clue:'Héroe viajero que usa la astucia para escapar de la cueva.'},
   {name:'Brontes, Estéropes y Arges',emoji:'🔨',group:'Aliados · cíclopes ancianos',clue:'Tres cíclopes que forjaron el rayo de Zeus.'},
   {name:'Atlas',emoji:'🌍',group:'Titán',clue:'Titán famoso por sostener el cielo.'},
   {name:'Atenea',emoji:'🦉',group:'Aliada · diosa olímpica',clue:'Diosa asociada con la sabiduría.'},
   {name:'Pegaso',emoji:'🪽',group:'Criatura aliada',clue:'Caballo alado de los relatos griegos.'}
  ]},
  {mode:'mitos-lectura',kind:'external',title:'Mitos y leyendas para leer · Árbol ABC',emoji:'🏺',url:'https://arbolabc.com/'}
 ]},
 'mitologia-india':{title:'Mitología India',key:'mitologia_india',modules:[
  {mode:'relatos',title:'Relatos y leyendas',emoji:'🪷',questions:[['En los relatos hindúes, ¿qué río es muy conocido y sagrado?',['Ganges','Nilo','Amazonas','Danubio'],'Ganges'],['¿Qué palabra se usa para una historia tradicional antigua?',['Leyenda','Receta','Horario','Mapa'],'Leyenda']]},
  {mode:'personajes',title:'Personajes',emoji:'🐘',questions:[['¿Qué dios hindú se representa a menudo con cabeza de elefante?',['Ganesha','Shiva','Rama','Krishna'],'Ganesha'],['¿Qué personaje de la epopeya Ramayana es un príncipe?',['Rama','Hanuman','Ganesha','Garuda'],'Rama']]},
  {mode:'simbolos',title:'Símbolos',emoji:'🦚',questions:[['¿Qué animal acompaña a Ganesha en muchas representaciones?',['Un ratón','Un oso polar','Un delfín','Una jirafa'],'Un ratón'],['¿Qué flor aparece con frecuencia como símbolo en relatos de la India?',['Loto','Margarita','Girasol','Tulipán'],'Loto']]}
 ]},
 juegos:{title:'Juegos',key:'juegos',modules:[
  {mode:'memoria',title:'Memoria',emoji:'🧠',questions:[['Recuerda la secuencia: sol, luna, sol. ¿Qué aparece primero?',['Sol','Luna','Estrella','Nube'],'Sol'],['¿Qué elemento se repite: gato, pez, gato, perro?',['Gato','Pez','Perro','Todos'],'Gato']]},
  {mode:'logica',title:'Lógica',emoji:'🧩',questions:[['¿Qué forma sigue? Círculo, cuadrado, círculo, cuadrado…',['Círculo','Triángulo','Estrella','Corazón'],'Círculo'],['Si tienes dos manzanas y te dan una más, ¿cuántas hay?',['Tres','Una','Cuatro','Cinco'],'Tres']]},
  {mode:'atencion',title:'Atención',emoji:'👀',questions:[['¿Cuál de estas palabras es un color?',['Verde','Ventana','Correr','Silla'],'Verde'],['¿Cuál es diferente? Gato, perro, conejo, manzana.',['Manzana','Gato','Perro','Conejo'],'Manzana']]},
  {mode:'cristic-juegos',kind:'external',title:'Más juegos para 6–8 años · Cristic',emoji:'🧩',url:'https://www.cristic.com/1o-y-2o-de-primaria/Juegos?lang=ca'},
  {mode:'cokitos-siete',kind:'external',title:'Juegos para 7 años · Cokitos',emoji:'🎮',url:'https://www.cokitos.com/category/juegos-para-ninos-de-7-anos/'}
 ]}
};
const slug=params.get('area')||'ciencias',area=areaCatalog[slug]||areaCatalog.ciencias,progressKey=`mundoAprendizajeProgressV3_${profileId}`;
document.title=`${area.title} · El mundo mágico de Mireia`;$('areaTitle').textContent=area.title;$('backToMap').onclick=()=>location.href=`preview-mapa-mireia.html?avatar=restored&profile=${encodeURIComponent(profileId)}`;
let progress={stars:0,rounds:0,byGame:{},byArea:{}};try{progress=JSON.parse(localStorage.getItem(progressKey))||progress}catch(e){}progress.byGame||={};progress.byArea||={};progress.byArea[area.key]||={gold:0,silver:0,bronze:0};const scores=progress.byArea[area.key];for(const k of ['gold','silver','bronze'])scores[k]=Math.max(0,Number(scores[k])||0);
function renderScores(){for(const k of ['gold','silver','bronze'])$(k+'Score').textContent=String(scores[k]%1000).padStart(3,'0')}
function saveProgress(module){progress.rounds=(Number(progress.rounds)||0)+1;progress.byGame[`${area.key}_${module.mode}`]=(Number(progress.byGame[`${area.key}_${module.mode}`])||0)+1;progress.stars=Object.values(progress.byArea).reduce((sum,item)=>sum+['gold','silver','bronze'].reduce((n,k)=>n+(Number(item?.[k])||0),0),0);localStorage.setItem(progressKey,JSON.stringify(progress));renderScores()}
let currentModule=null,answered=false;
function renderModules(){$('modules').innerHTML=area.modules.map(m=>m.kind==='external'?`<a class="module module-link" href="${m.url}" target="_blank" rel="noopener noreferrer"><span class="emoji" aria-hidden="true">${m.emoji}</span><strong>${m.title}</strong><small>Recurso externo · abre en otra pestaña</small></a>`:`<button class="module" data-mode="${m.mode}"><span class="emoji" aria-hidden="true">${m.emoji}</span><strong>${m.title}</strong></button>`).join('');document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>{currentModule=area.modules.find(m=>m.mode===b.dataset.mode);$('play').classList.add('active');nextRound();$('play').scrollIntoView({behavior:'smooth',block:'nearest'})}))}
function awardCorrect(){if(answered)return;answered=true;scores.gold++;saveProgress(currentModule);$('feedback').textContent='¡Muy bien! Respuesta correcta 😊';$('next').disabled=false}
function nextRound(){answered=false;$('feedback').textContent='';$('next').disabled=true;if(currentModule.kind==='sequence')sequenceRound();else if(currentModule.kind==='characters')characterRound();else if(currentModule.kind==='storyQuiz')startStoryQuiz();else questionRound()}
function questionRound(){const item=currentModule.questions[Math.floor(Math.random()*currentModule.questions.length)];$('title').textContent=currentModule.title;$('hint').textContent='Elige la respuesta correcta.';$('activity').innerHTML=`<div class="prompt"><div class="question">${item[0]}</div></div><div class="answers">${[...item[1]].sort(()=>Math.random()-.5).map(text=>`<button class="answer" data-answer="${text}">${text}</button>`).join('')}</div>`;$('activity').querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(answered)return;if(b.dataset.answer===item[2])awardCorrect();else $('feedback').textContent='Prueba otra vez 😊'}))}
function sequenceRound(){const story=currentModule.stories[Math.floor(Math.random()*currentModule.stories.length)],scenes=story.scenes.map((scene,index)=>({scene,index})).sort(()=>Math.random()-.5);let order=[];$('title').textContent=story.title;$('hint').textContent='Ordena las escenas de la historia tocándolas en el orden correcto.';$('activity').innerHTML=`<div class="scene-grid">${scenes.map(({scene,index})=>`<button class="scene-card" data-scene="${index}"><span class="scene-icon" aria-hidden="true">${scene[0]}</span><small>${scene[1]}</small></button>`).join('')}</div><div class="actions"><button class="action alt" id="resetOrder" type="button">Empezar de nuevo</button></div>`;const cards=[...$('activity').querySelectorAll('[data-scene]')];cards.forEach(button=>button.addEventListener('click',()=>{if(answered||button.disabled)return;const expected=order.length;if(Number(button.dataset.scene)!==expected){$('feedback').textContent='Esa escena va en otro lugar. Prueba otra 😊';return}order.push(expected);button.disabled=true;if(order.length===story.scenes.length)awardCorrect();else $('feedback').textContent='¡Bien! Sigue con la siguiente escena 😊'}));$('resetOrder').onclick=()=>{if(answered)return;order=[];cards.forEach(card=>card.disabled=false);$('feedback').textContent=''}}
function characterRound(){const characters=currentModule.characters,correct=characters[Math.floor(Math.random()*characters.length)],choices=[correct,...characters.filter(card=>card!==correct).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$('title').textContent=currentModule.title;$('hint').textContent='Lee la pista y encuentra la carta del personaje.';$('activity').innerHTML=`<div class="prompt"><div class="question">${correct.clue}</div></div><div class="answers">${choices.map(card=>`<button class="character-card" data-answer="${card.name}"><span class="character-icon" aria-hidden="true">${card.emoji}</span><strong>${card.name}</strong><small>${card.group}</small></button>`).join('')}</div>`;$('activity').querySelectorAll('[data-answer]').forEach(button=>button.addEventListener('click',()=>{if(answered)return;if(button.dataset.answer===correct.name)awardCorrect();else $('feedback').textContent='Prueba otra carta 😊'}))}
let storyQuestionIndex=0,storyCorrect=0,storyFinished=false;
function startStoryQuiz(){storyQuestionIndex=0;storyCorrect=0;storyFinished=false;answered=false;$('feedback').textContent='';$('next').disabled=true;$('next').textContent='Siguiente pregunta →';showStoryQuestion()}
function showStoryQuestion(){const question=currentModule.questions[storyQuestionIndex];$('title').textContent=currentModule.title;$('hint').textContent='Lee el cuento y responde las cinco preguntas. Al final verás el resultado del reto.';$('activity').innerHTML=`<div class="story-text">${currentModule.story}</div><p class="story-count">${storyQuestionIndex+1} / ${currentModule.questions.length}</p><div class="prompt"><div class="question">${question[0]}</div></div><div class="answers">${question[1].map(answer=>`<button class="answer" data-story-answer="${answer}">${answer}</button>`).join('')}</div>`;$('activity').querySelectorAll('[data-story-answer]').forEach(button=>button.addEventListener('click',()=>{if(answered)return;answered=true;if(button.dataset.storyAnswer===question[2])storyCorrect++;$('activity').querySelectorAll('[data-story-answer]').forEach(option=>option.disabled=true);$('next').textContent=storyQuestionIndex===currentModule.questions.length-1?'Terminar reto →':'Siguiente pregunta →';$('next').disabled=false}))}
function advanceStoryQuiz(){if(!answered)return;if(storyQuestionIndex<currentModule.questions.length-1){storyQuestionIndex++;answered=false;$('next').disabled=true;$('next').textContent='Siguiente pregunta →';showStoryQuestion();return}finishStoryQuiz()}
function finishStoryQuiz(){storyFinished=true;const mistakes=currentModule.questions.length-storyCorrect;if(mistakes===0){scores.gold+=2;$('feedback').textContent='¡Reto completado! ⭐⭐'}else if(mistakes<=2){scores.gold++;$('feedback').textContent='¡Reto completado! ⭐'}else $('feedback').textContent='Vuelve a leer el cuento y repite el reto cuando quieras.';saveProgress(currentModule);$('activity').innerHTML=`<div class="prompt"><div class="question">${mistakes>=3?'📖':'🎉'}</div><p>${mistakes>=3?'Puedes volver a leer la historia y probar otra vez.':'Gracias por leer. La biblioteca te espera para otro cuento.'}</p></div>`;$('next').textContent=mistakes>=3?'Repetir reto →':'Jugar otra vez →';$('next').disabled=false}
renderModules();renderScores();$('next').addEventListener('click',()=>{if(currentModule?.kind==='storyQuiz'){if(storyFinished)startStoryQuiz();else advanceStoryQuiz()}else nextRound()});$('change').addEventListener('click',()=>{$('play').classList.remove('active');$('modules').scrollIntoView({behavior:'smooth',block:'start'})});
</script><script src="ui-language.js"></script></body></html>
