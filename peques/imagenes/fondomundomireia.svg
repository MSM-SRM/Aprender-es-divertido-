<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">El Mundo Mágico de Mireia — propuesta de pantalla del mapa</title>
  <desc id="desc">Mapa de una isla de aventuras educativa con trece áreas, perfil y progreso arriba a la izquierda, fecha, hora, idiomas y salida arriba a la derecha, y un panel de eventos temporales separado abajo a la derecha.</desc>
  <defs>
    <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#74dbed"/><stop offset="1" stop-color="#168bb2"/></linearGradient>
    <linearGradient id="land" x2=".8" y2="1"><stop stop-color="#91dc79"/><stop offset=".48" stop-color="#5fbd6a"/><stop offset="1" stop-color="#32936a"/></linearGradient>
    <linearGradient id="top" x2="0" y2="1"><stop stop-color="#fffdf2"/><stop offset="1" stop-color="#f3f7ff"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff1a8"/><stop offset="1" stop-color="#f7b72e"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#27304d"/><stop offset="1" stop-color="#5b334c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#12314a" flood-opacity=".27"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#153858" flood-opacity=".2"/></filter>
    <pattern id="waves" width="92" height="50" patternUnits="userSpaceOnUse"><path d="M0 18q18-12 36 0t36 0t36 0M-30 42q18-12 36 0t36 0t36 0" fill="none" stroke="#d6fbff" stroke-opacity=".22" stroke-width="3"/></pattern>
    <style>
      text{font-family:'Trebuchet MS',Arial,sans-serif}
      .label{font-size:15px;font-weight:800;fill:#253653}
      .sub{font-size:11px;font-weight:700;fill:#586983}
      .node{fill:#fffdf6;stroke:#fff;stroke-width:3}
      .num{font-size:11px;font-weight:900;fill:white}
      .tiny{font-size:10px;font-weight:800;letter-spacing:.6px}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="34" fill="url(#sea)"/>
  <rect width="1600" height="1000" rx="34" fill="url(#waves)"/>
