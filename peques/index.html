<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#8b45dc">
    <title>Mi Mundo de Aprendizaje</title>
    <style>
        :root{--ink:#28213d;--muted:#655b77;--purple:#6558d3;--paper:#fffdf9}
        /* (Tu estilo CSS existente) */
        body {
            font-family: "Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
            color: var(--ink)
        }
        /* (Restante de tu CSS) */
        /* ... */
    </style>
</head>
<body>
<div class="app">
    <!-- Sección de selección de perfil -->
    <section id="profileChooser">
        <div class="profile-intro"><h1>¿Quién va a jugar hoy? ✨</h1><p>Elige tu perfil para entrar en tu mundo de aprendizaje.</p></div>
        <div class="profiles">
            <div class="profile-wrap">
                <button class="profile-card mireia" data-profile="mireia" aria-label="Entrar en el perfil de Mireia">
                    <img src="imagenes/mireia.png" alt="Foto de Mireia Sonali">
                    <div class="profile-details"><strong>Mireia Sonali</strong><span id="age-mireia"></span></div>
                </button><div class="birthday-countdown" id="birthday-mireia"></div>
            </div>
            <div class="profile-wrap">
                <button class="profile-card sofia" data-profile="sofia" aria-label="Entrar en el perfil de Sofía">
                    <img src="imagenes/sofia.png" alt="Foto de Sofía">
                    <div class="profile-details"><strong>Sofía</strong><span id="age-sofia"></span></div>
                </button><div class="birthday-countdown" id="birthday-sofia"></div>
            </div>
        </div>
        <p class="profile-footer">Cada una tendrá sus propias estrellas y progresos. 💜</p>
    </section>
    <!-- (Tu resto de HTML existente) -->
    <section class="jokes"><div class="joke-face">🤡</div><h2>¡Rincón de chistes!</h2><p id="jokeText">¿Qué hace una abeja en el gimnasio? ¡Zum-ba! 🐝</p><div class="action-row"><button class="primary" id="hearJoke">🔊 Escuchar chiste</button><button class="secondary" id="repeatJoke">🔁 Repetir chiste</button><button class="secondary" id="anotherJoke">😄 Otro chiste</button></div></section>
    <div id="appContent" class="hide">
        <header class="top"><div class="pill" id="starPill">⭐ 0 estrellas</div></header>
        <!-- (Tu resto de contenido existente) -->
    </div>

    <!-- Scripts integrados -->
    <script>
        // ===== VARIABLES GLOBALES =====
        const $=id=>document.getElementById(id);
        const state={age:3,game:null,round:0,score:0,answered:false,wordIndex:0,memFirst:null,memLock:false,memPairs:0};
        const STORE='mundoAprendizajeProgressV1';
        let currentProfile=null,progress={stars:0,rounds:0,byGame:{}},lastJoke=0;
        let sessionToken = localStorage.getItem('sessionToken') || null;
        let sessionExpires = parseInt(localStorage.getItem('sessionExpires')) || 0;
        let isSessionValid = sessionToken && sessionExpires > Date.now() / 1000;

        // ===== FUNCIONES DE AUTENTICACIÓN =====
        async function saveSession(token) {
            localStorage.setItem('sessionToken', token);
            localStorage.setItem('sessionExpires', Date.now() / 1000 + 7 * 24 * 60 * 60); // 7 días
            isSessionValid = true;
            sessionToken = token;
        }

        async function verifyPin(profile, pin) {
            try {
                const response = await fetch('https://mi-mundo-aprendizaje-api.paguerapiso.workers.dev/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'https://msm-srm.github.io'
                    },
                    body: JSON.stringify({
                        action: 'login',
                        profile,
                        pin
                    })
                });
                const data = await response.json();
                return data.ok;
            } catch(error) {
                console.error('Error de autenticación:', error);
                return false;
            }
        }

        async function validateSession() {
            if (!sessionToken || sessionExpires <= Date.now() / 1000) return false;
            try {
                const response = await fetch('https://mi-mundo-aprendizaje-api.paguerapiso.workers.dev/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'https://msm-srm.github.io'
                    },
                    body: JSON.stringify({
                        action: 'check_session',
                        token: sessionToken
                    })
                });
                return await response.json().ok;
            } catch(error) {
                console.error('Error de validación:', error);
                return false;
            }
        }

        // ===== FUNCIONES ORIGINALES (con modificaciones) =====
        function emptyProgress(){return {stars:0,rounds:0,byGame:{}}}
        function loadProgress(){try{return JSON.parse(localStorage.getItem(STORE+'_'+currentProfile))||emptyProgress()}catch(e){return emptyProgress()}}
        function saveProgress(){try{if(currentProfile)localStorage.setItem(STORE+'_'+currentProfile,JSON.stringify(progress))}catch(e){}renderProgress()}
        function renderProgress(){$('starPill').textContent='⭐ '+progress.stars+' estrellas';$('progressCount').textContent=progress.rounds+' retos';$('progressBar').style.width=Math.min(100,progress.rounds*5)+'%';$('progressNote').textContent=progress.rounds?`Has completado retos en ${Object.keys(progress.byGame).length} actividades. ¡Sigue así!`:'Juega para ganar tus primeras estrellas.';$('progressLabel').textContent=progress.rounds?'¡Buen trabajo!':'¡Cada intento cuenta!'}
        function speak(text){if(!('speechSynthesis'in window)){if($('feedback'))setFeedback('Este navegador no tiene voz disponible.');return}window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=state.age===3?.78:.9;window.speechSynthesis.speak(u)}
        function setFeedback(t){$('feedback').textContent=t}
        function setAge(){state.age=Number($('age').value);$('levelText').textContent=state.age===3?'Nivel descubrir':'Nivel practicar';$('mathTitle').textContent=state.age===3?'Contar objetos':'Retos matemáticos';$('mathDesc').textContent=state.age===3?'Cuenta y elige el número.':'Sumas y restas sencillas.';$('wordsDesc').textContent=state.age===3?'Escucha y reconoce palabras.':'Lee y reconoce palabras.'}
        function updateBirthdays(){/* (Tu código original) */}

        // ===== FUNCIONES MODIFICADAS =====
        async function selectProfile(profile) {
            loadSession();

            if (isSessionValid && await validateSession()) {
                // Si hay sesión válida, cargar el perfil directamente
                currentProfile = profile;
                $('age').value = profile === 'mireia' ? '7' : '3';
                setAge();
                progress = loadProgress();
                renderProgress();

                $('profileChooser').classList.add('hide');
                $('appContent').classList.remove('hide');
                $('home').classList.remove('hide');
                $('screen').classList.remove('active');
                state.game = null;
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                return;
            }

            // Mostrar diálogo de PIN
            const pinContainer = document.createElement('div');
            pinContainer.style.position = 'fixed';
            pinContainer.style.top = '0';
            pinContainer.style.left = '0';
            pinContainer.style.width = '100%';
            pinContainer.style.height = '100vh';
            pinContainer.style.background = 'rgba(0,0,0,0.7)';
            pinContainer.style.display = 'flex';
            pinContainer.style.flexDirection = 'column';
            pinContainer.style.justifyContent = 'center';
            pinContainer.style.alignItems = 'center';
            pinContainer.style.zIndex = '10000';
            pinContainer.style.backgroundColor = 'var(--paper)';
            pinContainer.style.borderRadius = '16px';
            pinContainer.style.padding = '20px';

            const pinGroup = document.createElement('div');
            pinGroup.style.display = 'flex';
            pinGroup.style.flexDirection = 'column';
            pinGroup.style.gap = '15px';

            const pinInput = document.createElement('input');
            pinInput.type = 'password';
            pinInput.placeholder = 'Introduce tu PIN (4-5 dígitos)';
            pinInput.style.width = '90%';
            pinInput.style.maxWidth = '300px';
            pinInput.style.padding = '12px';
            pinInput.style.fontSize = '1.2rem';
            pinInput.style.borderRadius = '16px';
            pinInput.style.border = '2px solid var(--purple)';
            pinInput.style.color = 'var(--ink)';
            pinInput.style.backgroundColor = 'var(--paper)';
            pinInput.style.textAlign = 'center';

            const submitBtn = document.createElement('button');
            submitBtn.textContent = 'Entrar';
            submitBtn.className = 'primary';
            submitBtn.style.padding = '12px 30px';
            submitBtn.style.fontSize = '1.1rem';
            submitBtn.style.backgroundColor = 'var(--purple)';
            submitBtn.style.color = 'white';
            submitBtn.style.border = 'none';
            submitBtn.style.borderRadius = '16px';
            submitBtn.style.cursor = 'pointer';

            pinGroup.appendChild(pinInput);
            pinGroup.appendChild(submitBtn);
            pinContainer.appendChild(pinGroup);

            document.body.appendChild(pinContainer);

            pinInput.addEventListener('keyup', async (e) => {
                if (e.key === 'Enter') {
                    const pin = pinInput.value.trim();
                    if (!pin || !/^\d{4,5}$/.test(pin)) {
                        alert('PIN debe tener 4-5 dígitos');
                        return;
                    }

                    const success = await verifyPin(profile, pin);
                    if (success) {
                        pinContainer.remove();
                        selectProfile(profile);
                    } else {
                        alert('PIN incorrecto. Inténtalo de nuevo.');
                        pinInput.value = '';
                    }
                }
            });

            submitBtn.addEventListener('click', async () => {
                const pin = pinInput.value.trim();
                if (!pin || !/^\d{4,5}$/.test(pin)) {
                    alert('PIN debe tener 4-5 dígitos');
                    return;
                }

                const success = await verifyPin(profile, pin);
                if (success) {
                    pinContainer.remove();
                    selectProfile(profile);
                } else {
                    alert('PIN incorrecto. Inténtalo de nuevo.');
                    pinInput.value = '';
                }
            });
        }

        // (Restante de tu código original)
        function emptyProgress(){return {stars:0,rounds:0,byGame:{}}}
        function loadProgress(){try{return JSON.parse(localStorage.getItem(STORE+'_'+currentProfile))||emptyProgress()}catch(e){return emptyProgress()}}
        function saveProgress(){try{if(currentProfile)localStorage.setItem(STORE+'_'+currentProfile,JSON.stringify(progress))}catch(e){}renderProgress()}
        function speak(text){if(!('speechSynthesis'in window)){if($('feedback'))setFeedback('Este navegador no tiene voz disponible.');return}window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=state.age===3?.78:.9;window.speechSynthesis.speak(u)}
        function setFeedback(t){$('feedback').textContent=t}
        function setAge(){state.age=Number($('age').value);$('levelText').textContent=state.age===3?'Nivel descubrir':'Nivel practicar';$('mathTitle').textContent=state.age===3?'Contar objetos':'Retos matemáticos';$('mathDesc').textContent=state.age===3?'Cuenta y elige el número.':'Sumas y restas sencillas.';$('wordsDesc').textContent=state.age===3?'Escucha y reconoce palabras.':'Lee y reconoce palabras.'}
        function updateBirthdays(){/* Tu código original */}

        // ===== EVENT LISTENERS =====
        $('age').addEventListener('change',setAge);
        $('switchProfile').onclick=()=>{if('speechSynthesis'in window)window.speechSynthesis.cancel();$('appContent').classList.add('hide');$('profileChooser').classList.remove('hide')};
        setAge();updateBirthdays();

        // Eventos para los perfiles
        document.querySelectorAll('[data-profile]').forEach(b=>b.addEventListener('click',async () => {
            const profile = b.dataset.profile;
            // Validar si hay sesión válida
            if (isSessionValid && await validateSession()) {
                selectProfile(profile);
            } else {
                // Si no hay sesión, mostrar diálogo de PIN
                const pinContainer = document.createElement('div');
                // (Código para mostrar diálogo de PIN) - mismo que arriba
                // ...
                // PinInput y submitBtn como antes
                pinInput.addEventListener('keyup', async (e) => {
                    if (e.key === 'Enter') {
                        const pin = pinInput.value.trim();
                        if (!pin || !/^\d{4,5}$/.test(pin)) {
                            alert('PIN debe tener 4-5 dígitos');
                            return;
                        }

                        const success = await verifyPin(profile, pin);
                        if (success) {
                            pinContainer.remove();
                            selectProfile(profile);
                        } else {
                            alert('PIN incorrecto. Inténtalo de nuevo.');
                            pinInput.value = '';
                        }
                    }
                });
                // ...
            }
        }));

        // Eventos para juegos y otros elementos
        document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.game)));
        $('speakWelcome').onclick=()=>speak(state.age===3?'¡Hola! Vamos a aprender jugando. Elige una actividad.':'¡Hola! Elige un reto y gana estrellas aprendiendo.');
        $('back').onclick=()=>{$('screen').classList.remove('active');$('home').classList.remove('hide');state.game=null;if('speechSynthesis'in window)window.speechSynthesis.cancel()};
        $('resetProgress').onclick=()=>{if(confirm('¿Quieres borrar las estrellas y los retos guardados en este dispositivo?')){progress=emptyProgress();saveProgress()}};
        $('next').onclick=()=>{if(state.game==='memory')startMemory();else startGame(state.game,true)};
        $('hear').onclick=()=>{if(state.game==='math')speak(state.questionText||'Cuenta los objetos.');else if(state.game==='words'||state.game==='listen')speak(state.currentWord||'Escucha y aprende.');else speak('Encuentra las parejas iguales.')};
        const jokes=['¿Qué hace una abeja en el gimnasio? ¡Zum-ba! 🐝','¿Qué le dice un pez a otro? ¡Nada, nada! 🐟','¿Cuál es el colmo de un jardinero? Que siempre lo dejen plantado. 🌱','¿Qué hace una vaca cuando sale el sol? ¡Sombra! 🐮','¿Qué le dice una pared a otra? Nos vemos en la esquina. 🧱','¿Qué animal tiene más dientes? ¡El ratoncito Pérez! 🐭'];
        function tellJoke(){speak($('jokeText').textContent)}
        $('hearJoke').onclick=tellJoke;$('repeatJoke').onclick=tellJoke;$('anotherJoke').onclick=()=>{lastJoke=(lastJoke+1+Math.floor(Math.random()*(jokes.length-1)))%jokes.length;$('jokeText').textContent=jokes[lastJoke];tellJoke()};

        // ===== FUNCIONES DE JUEGOS (originales) =====
        function startGame(game){state.game=game;state.answered=false;state.score=0;$('home').classList.add('hide');$('screen').classList.add('active');$('feedback').textContent='';$('next').classList.add('hide');$('gameArea').innerHTML='';if(game==='math')mathGame();if(game==='words')wordsGame();if(game==='listen')listenGame();if(game==='memory')startMemory()}
        function reward(){if(state.answered)return;state.answered=true;progress.stars++;progress.rounds++;progress.byGame[state.game]=(progress.byGame[state.game]||0)+1;saveProgress();$('next').classList.remove('hide')}
        function mathGame(){/* Tu código original */}
        function wordsGame(){/* Tu código original */}
        function listenGame(){/* Tu código original */}
        function startMemory(){/* Tu código original */}
        function flipCard(i,b){/* Tu código original */}

        // ===== INICIALIZACIÓN =====
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar sesión al cargar la página
            loadSession();

            // Eventos para los perfiles
            document.querySelectorAll('[data-profile]').forEach(b=>b.addEventListener('click',async () => {
                const profile = b.dataset.profile;
                if (isSessionValid && await validateSession()) {
                    selectProfile(profile);
                }
            }));
        });
    </script>
</div>
</body>
</html>
