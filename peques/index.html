<!DOCTYPE html>
<html lang="es">
<head>
  <!-- (Tu código HTML existente) -->
  <script>
    // Variables globales para almacenar el token de sesión
    let currentProfile = null;
    let sessionToken = null;
    let sessionExpires = 0;

    // Función para enviar el PIN al Cloudflare Worker
    async function verifyPin(profile, pin) {
      try {
        const response = await fetch(
          "https://mi-mundo-aprendizaje-api.paguerapiso.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Origin": "https://msm-srm.github.io",
            },
            body: JSON.stringify({
              action: "login",
              profile,
              pin,
            }),
          }
        );

        const data = await response.json();

        if (data.ok) {
          // Guardar token en localStorage (para validar en el futuro)
          sessionToken = data.token;
          sessionExpires = data.expiresAt;
          return true; // PIN válido
        } else {
          return false; // PIN incorrecto
        }
      } catch (error) {
        console.error("Error al verificar PIN:", error);
        return false;
      }
    }

    // Función para cambiar de perfil (antes de pedir el PIN)
    function selectProfile(profile) {
      // Primero, verifica si el PIN es correcto (si hay sesión activa)
      if (sessionToken && sessionExpires > Date.now() / 1000) {
        currentProfile = profile;
        // Desbloquear el menú principal
        document.querySelectorAll('[data-profile]').forEach(btn => {
          btn.style.opacity = "1";
        });
        return;
      }

      // Si no hay sesión activa, pedir el PIN
      const pinInput = document.createElement("input");
      pinInput.type = "password";
      pinInput.placeholder = "Introduce el PIN (5 dígitos)";
      pinInput.style.position = "fixed";
      pinInput.style.top = "0";
      pinInput.style.left = "0";
      pinInput.style.width = "100%";
      pinInput.style.padding = "10px";
      pinInput.style.background = "rgba(0,0,0,0.5)";
      pinInput.style.color = "white";
      pinInput.style.zIndex = "1000";

      document.body.appendChild(pinInput);

      // Esconder el menú de selección de perfiles
      document.querySelectorAll('.profile-card').forEach(btn => {
        btn.style.opacity = "0.5";
      });

      pinInput.addEventListener("keyup", async (e) => {
        if (e.key === "Enter") {
          const pin = e.target.value.trim();
          if (pin.length >= 4 && pin.length <= 5) {
            const isValid = await verifyPin(profile, pin);
            if (isValid) {
              currentProfile = profile;
              // Actualizar el menú y cargar el contenido
              document.querySelectorAll('[data-profile]').forEach(btn => {
                btn.style.opacity = "1";
              });
              document.querySelector('.profileChooser').classList.add('hide');
              document.querySelector('.appContent').classList.remove('hide');
              loadProfile();
            } else {
              alert("PIN incorrecto. Inténtalo de nuevo.");
            }
            document.body.removeChild(pinInput);
          }
        }
      });
    }

    // Función para cargar el perfil actual (si hay sesión activa)
    function loadProfile() {
      if (!currentProfile) return;

      // Verificar si el token aún es válido
      if (!sessionToken || sessionExpires <= Date.now() / 1000) {
        alert("Sesión expirada. Introduce el PIN para continuar.");
        return;
      }

      // Cargar el contenido del perfil seleccionado
      document.querySelectorAll('[data-profile]').forEach(btn => {
        if (btn.dataset.profile === currentProfile) {
          btn.click(); // Simular la selección del perfil
        }
      });
    }

    // Event listeners para cambiar de perfil
    document.querySelectorAll('[data-profile]').forEach(btn => {
      btn.addEventListener("click", () => {
        selectProfile(btn.dataset.profile);
      });
    });

    // Cargar la sesión existente al cargar la página
    loadProfile();

    // (Tu código HTML y JS existente)
  </script>
</head>
<body>
  <!-- (Tu código HTML existente, incluyendo el menú de perfiles) -->
  <section id="profileChooser">
    <div class="profile-intro">
      <h1>¿Quién va a jugar hoy? ✨</h1>
      <p>Elige tu perfil para entrar en tu mundo de aprendizaje.</p>
    </div>
    <div class="profiles">
      <div class="profile-wrap">
        <button class="profile-card mireia" data-profile="mireia" aria-label="Entrar en el perfil de Mireia">
          <img src="imagenes/mireia.png" alt="Foto de Mireia Sonali">
          <div class="profile-details">
            <strong>Mireia Sonali</strong>
            <span id="age-mireia"></span>
          </div>
        </button>
        <div class="birthday-countdown" id="birthday-mireia"></div>
      </div>
      <div class="profile-wrap">
        <button class="profile-card sofia" data-profile="sofia" aria-label="Entrar en el perfil de Sofía">
          <img src="imagenes/sofia.png" alt="Foto de Sofía">
          <div class="profile-details">
            <strong>Sofía</strong>
            <span id="age-sofia"></span>
          </div>
        </button>
        <div class="birthday-countdown" id="birthday-sofia"></div>
      </div>
    </div>
    <p class="profile-footer">Cada una tendrá sus propias estrellas y progresos. 💜</p>
  </section>

  <!-- (El resto de tu código HTML y JS) -->
  <div id="appContent" class="hide">
    <!-- (Contenido principal) -->
  </div>
</body>
</html>
