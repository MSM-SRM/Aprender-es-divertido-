<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Mundo de Aprendizaje</title>
  <style>
    /* Estilos básicos para la página */
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    #profileChooser {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .profile-intro {
      text-align: center;
      margin-bottom: 20px;
    }
    .profile-intro h1 {
      font-size: clamp(1.65rem, 5vw, 2.35rem);
      margin: 0 0 7px;
      font-style: italic;
    }
    .profile-intro p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    .profiles {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .profile-wrap {
      width: 200px;
      margin: 10px;
      text-align: center;
    }
    .profile-card {
      width: 100%;
      max-width: 350px;
      aspect-ratio: 1;
      border-radius: 50%;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      overflow: hidden;
      color: white;
      border: 4px solid rgba(255, 255, 255, .85);
      box-shadow: 0 10px 28px #45325a28;
    }
    .profile-card.mireia {
      background: linear-gradient(140deg, #fff0a3 0%, #ffd966 27%, #e6ad32 56%, #fff1b8 76%, #c99119 100%);
      box-shadow: 0 10px 28px #c9911938;
    }
    .profile-card.sofia {
      background: linear-gradient(140deg, #c06bff 0%, #b45cff 28%, #8200ff 58%, #5100c9 100%);
      box-shadow: 0 10px 28px #8200ff30;
    }
    .profile-card img {
      width: 74%;
      height: 74%;
      max-height: 74%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .92);
      background: #fff;
      flex: 0 0 auto;
    }
    .profile-details {
      width: 91%;
      padding: 7px 5px;
      border-radius: 14px;
      background: rgba(40, 25, 65, .42);
      text-align: center;
      line-height: 1.18;
      flex: 0 0 auto;
    }
    .profile-details strong {
      display: block;
      font-size: clamp(.83rem, 2.6vw, 1.15rem);
      color: #fff;
    }
    .profile-details span {
      display: block;
      font-size: clamp(.65rem, 1.8vw, .82rem);
      color: #fff;
      margin-top: 4px;
    }
    .birthday-countdown {
      text-align: center;
      min-height: 42px;
      padding: 8px 2px 0;
      font-size: clamp(.68rem, 2vw, .9rem);
      font-weight: 800;
      line-height: 1.25;
    }
    .profile-footer {
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
      margin: 8px 0 22px;
    }
    .jokes {
      max-width: 740px;
      margin: 25px auto 0;
      padding: 20px;
      border-radius: 25px;
      background: linear-gradient(135deg, #fff0f7, #fff8d9);
      text-align: center;
      box-shadow: 0 7px 22px #3b327010;
    }
    .jokes h2 {
      margin: 0 0 7px;
      font-size: 1.35rem;
    }
    .jokes p {
      margin: 8px 0 14px;
    }
    .joke-face {
      font-size: 2.25rem;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .controls label {
      font-weight: 800;
    }
    .controls select {
      border: 2px solid #e7e3ff;
      background: #fff;
      border-radius: 13px;
      padding: 10px 12px;
      color: var(--ink);
      font-weight: 700;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin: 0 0 12px;
    }
    .pill {
      background: white;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: .9rem;
      box-shadow: 0 4px 14px #3b327010;
    }
    .hero {
      background: linear-gradient(120deg, #6558d3, #897ce9);
      color: white;
      border-radius: 28px;
      padding: 23px 21px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 28px #6558d326;
    }
    .hero h1 {
      font-size: clamp(1.65rem, 5vw, 2.5rem);
      line-height: 1.08;
      margin: 0 0 10px;
      max-width: 520px;
    }
    .hero p {
      margin: 0;
      max-width: 520px;
      line-height: 1.5;
      color: #f1efff;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 23px 2px 12px;
    }
    .section-title h2 {
      font-size: 1.2rem;
    }
    .section-title small {
      color: var(--muted);
    }
    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .game {
      padding: 17px 15px;
      text-align: left;
      min-height: 158px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      border: 2px solid #fff;
      background: #fff;
      border-radius: 23px;
      box-shadow: 0 7px 20px #3b32700c;
    }
    .game .emoji {
      font-size: 2.25rem;
    }
    .game strong {
      font-size: 1.05rem;
    }
    .game span:last-child {
      font-size: .9rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .game:nth-child(1) {
      background: #fff3c9;
    }
    .game:nth-child(2) {
      background: #ffe5f0;
    }
    .game:nth-child(3) {
      background: #e1f8e9;
    }
    .game:nth-child(4) {
      background: #e1f8e9;
    }
    @media (max-width: 380px) {
      .profiles {
        gap: 6px;
      }
      .profile-card {
        padding: 5px;
        border-width: 3px;
      }
      .profile-card img {
        width: 72%;
        height: 72%;
      }
      .profile-details {
        padding: 5px 3px;
      }
      .profile-details strong {
        font-size: .76rem;
      }
      .profile-details span {
        font-size: .61rem;
      }
    }
    @media (min-width: 620px) {
      .app {
        padding: 24px;
      }
      .games {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .game {
        min-height: 190px;
        padding: 19px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <section id="profileChooser" class="profileChooser">
    <div class="profile-intro">
      <h1>¿Quién va a jugar hoy? ✨</h1>
      <p>Elige tu perfil para entrar en tu mundo de aprendizaje.</p>
    </div>
    <div class="profiles">
      <div class="profile-wrap">
        <button class="profile-card mireia" data-profile="mireia" aria-label="Entrar en el perfil de Mireia">
          <img src="imagenes/mireia.png" alt="Foto de Mireia Sonali">
          <div class="profile-details">
            <strong>Mireia Sonali</strong>
            <span id="age-mireia"></span>
          </div>
        </button>
        <div class="birthday-countdown" id="birthday-mireia"></div>
      </div>
      <div class="profile-wrap">
        <button class="profile-card sofia" data-profile="sofia" aria-label="Entrar en el perfil de Sofía">
          <img src="imagenes/sofia.png" alt="Foto de Sofía">
          <div class="profile-details">
            <strong>Sofía</strong>
            <span id="age-sofia"></span>
          </div>
        </button>
        <div class="birthday-countdown" id="birthday-sofia"></div>
      </div>
    </div>
    <p class="profile-footer">Cada una tendrá sus propias estrellas y progresos. 💜</p>
  </section>

  <div id="appContent" class="appContent hide">
    <h2>¡Bienvenida al mundo de aprendizaje!</h2>
    <p>Este es el contenido de la aplicación. Se cargará dinámicamente según el perfil seleccionado.</p>
    <button data-profile="mireia">Cambiar a Mireia</button>
    <button data-profile="sofia">Cambiar a Sofía</button>
    <button onclick="clearSession(); document.querySelector('.profileChooser').classList.remove('hide'); document.querySelector('.appContent').classList.add('hide');">Cerrar Sesión</button>
  </div>
</body>
</html>
