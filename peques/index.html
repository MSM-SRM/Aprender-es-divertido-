<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprender es Divertido</title>
    <style>
        /* (Tu estilo CSS existente) */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        #profileChooser {
            text-align: center;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .profiles {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .profile-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            opacity: 0.8;
            transition: all 0.3s;
        }
        .profile-card:hover {
            opacity: 1;
            transform: translateY(-2px);
        }
        .profile-card.mireia {
            background-color: #e3f2fd;
        }
        .profile-card.sofia {
            background-color: #fff3e0;
        }
        .profile-details {
            margin-top: 10px;
            font-weight: bold;
        }
        .birthday-countdown {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .hide {
            display: none;
        }
        #appContent {
            padding: 20px;
            background-color: #fff;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Sección de selección de perfil -->
    <section id="profileChooser">
        <div class="profile-intro">
            <h1>¿Quién va a jugar hoy? ✨</h1>
            <p>Elige tu perfil para entrar en tu mundo de aprendizaje.</p>
        </div>
        <div class="profiles">
            <div class="profile-wrap">
                <button class="profile-card mireia" data-profile="mireia" aria-label="Entrar en el perfil de Mireia">
                    <img src="imagenes/mireia.png" alt="Foto de Mireia Sonali">
                    <div class="profile-details">
                        <strong>Mireia Sonali</strong>
                        <span id="age-mireia">3 años</span>
                    </div>
                </button>
                <div class="birthday-countdown" id="birthday-mireia">¡Hoy cumple 3!</div>
            </div>
            <div class="profile-wrap">
                <button class="profile-card sofia" data-profile="sofia" aria-label="Entrar en el perfil de Sofía">
                    <img src="imagenes/sofia.png" alt="Foto de Sofía">
                    <div class="profile-details">
                        <strong>Sofía</strong>
                        <span id="age-sofia">4 años</span>
                    </div>
                </button>
                <div class="birthday-countdown" id="birthday-sofia">¡Hoy cumple 4!</div>
            </div>
        </div>
        <p class="profile-footer">Cada una tendrá sus propias estrellas y progresos. 💜</p>
    </section>

    <!-- Contenido principal (oculto inicialmente) -->
    <div id="appContent" class="hide">
        <h2>Bienvenido/a, {{currentProfile}}!</h2>
        <p>¡Estás en tu espacio personalizado!</p>
        <!-- Aquí irían tus juegos y contenido -->
    </div>

    <script>
        // ===== VARIABLES GLOBALES =====
        let currentProfile = null;
        let sessionToken = localStorage.getItem('sessionToken') || null;
        let sessionExpires = parseInt(localStorage.getItem('sessionExpires')) || 0;
        let isSessionValid = false;

        // ===== FUNCIONES =====
        // 1. Guardar sesión en localStorage
        function saveSession(token, expiresAt) {
            localStorage.setItem('sessionToken', token);
            localStorage.setItem('sessionExpires', expiresAt);
            isSessionValid = true;
            currentProfile = token.split('_')[0]; // Extraer el perfil del token
        }

        // 2. Cargar sesión existente
        function loadSession() {
            isSessionValid = sessionToken && sessionExpires > Date.now() / 1000;
            if (isSessionValid) {
                currentProfile = 'mireia'; // Por defecto, cargar perfil de Mireia
            }
        }

        // 3. Verificar PIN con el servidor
        async function verifyPin(profile, pin) {
            try {
                const response = await fetch('https://mi-mundo-aprendizaje-api.paguerapiso.workers.dev/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'https://msm-srm.github.io'
                    },
                    body: JSON.stringify({
                        action: 'login',
                        profile,
                        pin
                    })
                });
                const data = await response.json();

                if (data.ok) {
                    saveSession(data.token, data.expiresAt);
                    return true;
                }
                return false;
            } catch(error) {
                console.error('Error:', error);
                return false;
            }
        }

        // 4. Validar sesión en el backend
        async function validateSession() {
            if (!sessionToken || sessionExpires <= Date.now() / 1000) return false;

            try {
                const response = await fetch('https://mi-mundo-aprendizaje-api.paguerapiso.workers.dev/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': 'https://msm-srm.github.io'
                    },
                    body: JSON.stringify({
                        action: 'check_session',
                        token: sessionToken
                    })
                });
                return await response.json().ok;
            } catch(error) {
                console.error('Error de validación:', error);
                return false;
            }
        }

        // 5. Función principal para seleccionar perfil
        async function selectProfile(profile) {
            loadSession();

            // Si hay sesión válida, cargar contenido directamente
            if (isSessionValid && await validateSession()) {
                currentProfile = profile;
                document.querySelector('.profileChooser').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                loadProfileContent();
                return;
            }

            // Mostrar input de PIN
            const pinContainer = document.createElement('div');
            pinContainer.id = 'pinContainer';
            pinContainer.style.position = 'fixed';
            pinContainer.style.top = '0';
            pinContainer.style.left = '0';
            pinContainer.style.width = '100%';
            pinContainer.style.height = '100vh';
            pinContainer.style.background = 'rgba(0,0,0,0.7)';
            pinContainer.style.display = 'flex';
            pinContainer.style.flexDirection = 'column';
            pinContainer.style.justifyContent = 'center';
            pinContainer.style.alignItems = 'center';
            pinContainer.style.zIndex = '9999';

            const pinInput = document.createElement('input');
            pinInput.type = 'password';
            pinInput.placeholder = 'Introduce tu PIN (4-5 dígitos)';
            pinInput.style.width = '90%';
            pinInput.style.maxWidth = '300px';
            pinInput.style.padding = '12px';
            pinInput.style.fontSize = '16px';
            pinInput.style.borderRadius = '8px';
            pinInput.style.border = '1px solid #ccc';

            const submitBtn = document.createElement('button');
            submitBtn.textContent = 'Continuar';
            submitBtn.style.padding = '10px 20px';
            submitBtn.style.backgroundColor = '#6558d3';
            submitBtn.style.color = 'white';
            submitBtn.style.border = 'none';
            submitBtn.style.borderRadius = '6px';
            submitBtn.style.cursor = 'pointer';
            submitBtn.style.marginTop = '20px';

            pinInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') submitBtn.click();
            });

            submitBtn.addEventListener('click', async () => {
                const pin = pinInput.value.trim();
                if (!pin || !/^\d{4,5}$/.test(pin)) {
                    alert('PIN debe tener 4-5 dígitos');
                    return;
                }

                const success = await verifyPin(profile, pin);
                if (success) {
                    pinContainer.remove();
                    document.querySelector('.profileChooser').style.display = 'none';
                    document.getElementById('appContent').style.display = 'block';
                    loadProfileContent();
                } else {
                    alert('PIN incorrecto. Inténtalo de nuevo.');
                }
            });

            pinContainer.appendChild(pinInput);
            pinContainer.appendChild(submitBtn);
            document.body.appendChild(pinContainer);
        }

        // 6. Cargar contenido del perfil
        function loadProfileContent() {
            if (!currentProfile) return;

            document.getElementById('appContent').innerHTML = `
                <h2>¡Bienvenid@, ${currentProfile}!</h2>
                <p>¡Estás en tu espacio personalizado!</p>
                <!-- Aquí irían tus juegos y contenido -->
                <button id="resetSession" onclick="resetSession()">Borrar sesión</button>
            `;
        }

        // 7. Función para resetear sesión
        function resetSession() {
            if (confirm('¿Borrarás tu sesión actual?')) {
                localStorage.removeItem('sessionToken');
                localStorage.removeItem('sessionExpires');
                isSessionValid = false;
                currentProfile = null;
                document.querySelector('.profileChooser').style.display = 'block';
                document.getElementById('appContent').style.display = 'none';
            }
        }

        // ===== EVENT LISTENERS =====
        // Listener para los botones de perfil
        document.querySelectorAll('[data-profile]').forEach(button => {
            button.addEventListener('click', () => {
                selectProfile(button.dataset.profile);
            });
        });

        // Inicializar al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            loadSession();

            // Si hay sesión válida, cargar contenido
            if (isSessionValid) {
                document.querySelector('.profileChooser').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                loadProfileContent();
            }
        });
    </script>
</div>
</body>
</html>
