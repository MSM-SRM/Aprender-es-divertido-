<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#72ad3e">
<title>El abecedario de Capi · Mi Mundo de Aprendizaje</title>
<script src="auth-guard.js"></script>
<script>
(()=>{const params=new URLSearchParams(location.search),profile=params.get('profile')||'mireia',englishOnly=['mireia','guest'].includes(profile)&&params.get('uiLang')==='en',allowed=profile==='sofia'||englishOnly;if(!allowed){location.replace(`areas-test.html?area=juegos&profile=${encodeURIComponent(profile)}`);return}if(englishOnly)document.documentElement.dataset.alphabetProfile='english-only'})();
</script>
<style>
*{box-sizing:border-box}
:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#24432c;background:#d9e8c9}
html[data-alphabet-profile="english-only"] .langs{display:none}
body{margin:0;min-height:100vh;background:linear-gradient(#f3f6e2aa,#f3f6e2aa),url("imagenes/fondo-supermercado-lidl.jpg") center/cover fixed;padding:clamp(12px,3vw,30px)}
button{font:inherit;touch-action:manipulation;cursor:pointer}
.wrap{width:min(100%,1040px);margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{border:2px solid #d2e7c2;border-radius:999px;background:#fff;color:#315d3b;padding:10px 15px;font-weight:900;box-shadow:0 4px 12px #243d2822;text-decoration:none}
h1{margin:0;text-align:center;color:#245a31;font-size:clamp(1.7rem,5vw,3rem);text-shadow:0 2px #fff}
.intro{margin:18px auto 22px;padding:clamp(14px,3vw,24px);display:flex;align-items:center;justify-content:center;gap:15px;text-align:left;background:#fffef0ed;border:3px solid #fff;border-radius:25px;box-shadow:0 8px 24px #243d2825}
.intro p{margin:3px 0;color:#55734d;font-size:clamp(1rem,2.4vw,1.2rem);font-weight:700}
.mascot{width:clamp(92px,16vw,132px);height:auto;max-height:105px;flex:none;object-fit:contain;border-radius:18px}
.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px;padding:clamp(12px,3vw,22px);background:#fffdf0e8;border:3px solid #fff;border-radius:27px;box-shadow:0 10px 28px #243d2825}
.letter{min-height:78px;border:3px solid #e7c869;border-radius:20px;background:linear-gradient(145deg,#fff,#fff3c9);color:#365d38;font-size:clamp(1.8rem,5vw,2.7rem);font-weight:1000;box-shadow:0 4px 0 #d9b452;transition:transform .12s,background .12s}
.letter:nth-child(3n){border-color:#a9d492;background:linear-gradient(145deg,#fff,#e3f5d6);box-shadow:0 4px 0 #8abd70}
.letter:nth-child(3n + 1){border-color:#b8c8ed;background:linear-gradient(145deg,#fff,#e9efff);box-shadow:0 4px 0 #93a6d4}
.letter:hover,.letter:focus-visible{transform:translateY(-3px);outline:3px solid #4b8f4e;outline-offset:2px}
.letter:active{transform:translateY(2px);box-shadow:none}
.foot{text-align:center;margin:15px 0 2px;color:#294f35;font-weight:800;text-shadow:0 1px #fff}
.reveal{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:#17391c9c;overflow:auto;animation:fadeIn .15s ease-out}
.reveal[hidden]{display:none}
.picture{position:relative;width:min(100%,430px);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 22px 24px;border:5px solid #fff;border-radius:32px;background:linear-gradient(145deg,#fffef2,#e7f7dc);box-shadow:0 18px 55px #102d18a8;text-align:center;overflow:auto}
.close{position:absolute;top:8px;right:9px;width:44px;height:44px;border:2px solid #d9e9cf;border-radius:50%;background:#fff;color:#325b39;font-size:1.55rem;font-weight:900;line-height:1}
.picture-letter{font-size:clamp(2rem,8vw,3.2rem);font-weight:1000;color:#52813b;line-height:1}
.object-photo{display:block;width:min(100%,360px);height:min(220px,30vh);min-height:135px;object-fit:contain;border-radius:16px;background:#fff;box-shadow:0 5px 16px #35572b27}
.object-name{margin:0;color:#284e30;font-size:clamp(1.8rem,7vw,2.6rem);font-weight:1000}
.credits a{color:#315d3b;text-underline-offset:2px}
.speech-status{max-width:340px;min-height:1.35em;margin:0;color:#536d4e;font-size:.9rem;font-weight:700;line-height:1.35}
.say-again{border:0;border-radius:999px;background:#538a3b;color:white;padding:10px 17px;min-height:44px;font-weight:900;box-shadow:0 4px 0 #3f6d2d}
.say-again:focus-visible,.close:focus-visible{outline:3px solid #17391c;outline-offset:3px}
.credits{margin:14px auto 0;padding:11px 15px;max-width:760px;border:2px solid #fff;border-radius:18px;background:#fffef0ed;color:#365b39;box-shadow:0 5px 14px #243d2822;font-size:.9rem}
.credits h2{margin:0;font-size:1rem}
.credits-toggle{min-height:44px;padding:8px 13px;border:2px solid #d2e7c2;border-radius:999px;background:#fff;color:#315d3b;font-weight:900}
.credits-toggle:focus-visible{outline:3px solid #17391c;outline-offset:3px}
.credits-content[hidden]{display:none}
.credits-content{max-height:48vh;overflow:auto;margin-top:8px;padding:0 7px}
.credits-content h3{margin:12px 0 4px;font-size:1rem}
.credits-content ul{margin:4px 0 12px;padding-left:22px}
.credits-content li{margin:6px 0;line-height:1.4;overflow-wrap:anywhere}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:520px){.top{align-items:flex-start}.back{padding:8px 10px;font-size:.88rem}.intro{margin:13px auto 16px}.mascot{width:82px;max-height:72px}.letters{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px}.letter{min-height:66px;border-radius:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back" id="back" href="index.html?profile=sofia">← Volver a Juegos</a>
    <h1>🔤 El abecedario de Capi</h1>
    <nav class="langs" aria-label="Cambiar idioma"></nav>
  </header>
  <section class="intro" aria-label="Instrucciones">
    <img class="mascot" src="imagenes/abecedario/capi-mascota.png" alt="Capi, una capibara simpática" width="500" height="375">
    <div><strong>¡Hola! Soy Capi, tu amiga capibara.</strong><p>Toca una letra y descubre un objeto. ¡Lo diremos juntos!</p></div>
  </section>
  <section class="letters" id="letters" aria-label="Letras del abecedario" aria-busy="true"></section>
  <p class="foot">Explora las letras a tu ritmo 🌼</p>
  <section class="credits" aria-labelledby="creditsTitle">
    <h2><button class="credits-toggle" id="creditsTitle" type="button" aria-expanded="false" aria-controls="creditsContent" aria-describedby="creditsHint">Créditos</button></h2>
    <span class="sr-only" id="creditsHint">Toca este botón cinco veces seguidas para consultar las autorías y licencias.</span>
    <span class="sr-only" id="creditsStatus" role="status" aria-live="polite"></span>
    <div class="credits-content" id="creditsContent" aria-labelledby="creditsTitle" hidden></div>
  </section>
</main>
<section class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="objectName" aria-describedby="pictureLetter" hidden>
  <div class="picture">
    <button class="close" id="close" type="button" aria-label="Cerrar imagen">×</button>
    <span class="picture-letter" id="pictureLetter"></span>
    <img class="object-photo" id="objectImage" alt="">
    <h2 class="object-name" id="objectName"></h2>
    <p class="speech-status" id="speechStatus" role="status" aria-live="polite"></p>
    <button class="say-again" id="sayAgain" type="button">🔊 Escuchar otra vez</button>
  </div>
</section>
<p class="sr-only" id="announcement" aria-live="polite"></p>
<audio id="voiceAudio" preload="auto" hidden></audio>
<script src="ui-language.js"></script>
<script>
const alphabet={es:'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split(''),en:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')};
const labels={es:{letter:'Letra',for:'de',photo:'Fotografía de'},en:{letter:'Letter',for:'for',photo:'Photo of'},ca:{letter:'Lletra',for:'de',photo:'Fotografia de'},de:{letter:'Buchstabe',for:'wie',photo:'Foto von'}};
const params=new URLSearchParams(location.search);
const profile=params.get('profile')||'mireia';
const letters=document.getElementById('letters');
const reveal=document.getElementById('reveal');
const image=document.getElementById('objectImage');
const name=document.getElementById('objectName');
const letterLabel=document.getElementById('pictureLetter');
const announcement=document.getElementById('announcement');
const speechStatus=document.getElementById('speechStatus');
const voiceAudio=document.getElementById('voiceAudio');
const creditsButton=document.getElementById('creditsTitle');
const creditsHint=document.getElementById('creditsHint');
const creditsContent=document.getElementById('creditsContent');
const creditsStatus=document.getElementById('creditsStatus');
let creditsActivations=0;
let closeTimer=0,speechWatchdog=0,voiceWaitTimer=0,voiceWaitCancel=null,speechRequest=0,audioRequest=0,loadRequest=0,currentItem=null,activeAlphabet=[];
const currentUiLanguage=()=>window.MiIdioma?window.MiIdioma.current():(params.get('uiLang')||'es');
const currentVoiceLanguage=()=>currentUiLanguage()==='en'?'en-GB':'es-ES';
const currentWordLanguage=()=>currentUiLanguage()==='en'?'en':'es';
const audioLetter=letter=>letter==='Ñ'?'N-tilde':letter;
const speechMessages={
  es:{playing:'Reproduciendo…',searching:'Buscando una voz adecuada…',done:'La voz ha terminado. La imagen se cerrará en 2 segundos.',error:'No se pudo reproducir el audio. Puedes leer la palabra.'},
  en:{playing:'Playing…',searching:'Looking for a suitable voice…',done:'The voice has finished. The picture will close in 2 seconds.',error:'Audio could not be played. You can read the word.'},
  ca:{playing:'Reproduint…',searching:'Buscant una veu adequada…',done:'La veu ha acabat. La imatge es tancarà en 2 segons.',error:'No s’ha pogut reproduir l’àudio. Pots llegir la paraula.'},
  de:{playing:'Wird abgespielt…',searching:'Geeignete Stimme wird gesucht…',done:'Die Stimme ist beendet. Das Bild schließt sich in 2 Sekunden.',error:'Das Audio konnte nicht abgespielt werden. Du kannst das Wort lesen.'}
};
const speechText=()=>speechMessages[currentUiLanguage()]||speechMessages.es;
function stopVoiceAudio(){
  audioRequest++;
  if(!voiceAudio)return;
  voiceAudio.onended=null;
  voiceAudio.onerror=null;
  try{voiceAudio.pause();voiceAudio.currentTime=0}catch(error){}
}
function playItemAudio(item){
  if(!item)return;
  if(!voiceAudio){speakWithSynthesis(item.word);return}
  const request=++audioRequest;
  clearSpeechTimers();
  voiceAudio.onended=null;
  voiceAudio.onerror=null;
  try{voiceAudio.pause();voiceAudio.currentTime=0}catch(error){}
  const messages=speechText();
  speechStatus.textContent=messages.playing;
  let settled=false;
  const finish=()=>{
    if(settled||request!==audioRequest||reveal.hidden)return;
    settled=true;
    window.clearTimeout(speechWatchdog);
    speechStatus.textContent=messages.done;
    scheduleCloseAfterSpeech();
  };
  const fallback=()=>{
    if(settled||request!==audioRequest||reveal.hidden)return;
    settled=true;
    window.clearTimeout(speechWatchdog);
    speechStatus.textContent='';
    speakWithSynthesis(item.word);
  };
  voiceAudio.src=`audios/abecedario/${currentWordLanguage()}/${audioLetter(item.letter)}.mp3`;
  voiceAudio.onended=finish;
  voiceAudio.onerror=fallback;
  speechWatchdog=window.setTimeout(fallback,15000);
  const playback=voiceAudio.play();
  if(playback&&typeof playback.catch==='function')playback.catch(fallback);
}
function updateCreditsHint(){
  const messages={
    es:'Activa este botón cinco veces seguidas para consultar las autorías y licencias.',
    en:'Activate this button five times in a row to view attributions and licences.',
    ca:'Activa aquest botó cinc vegades seguides per consultar les autories i les llicències.',
    de:'Aktiviere diese Schaltfläche fünfmal hintereinander, um Urheberangaben und Lizenzen anzuzeigen.'
  };
  creditsHint.textContent=messages[currentUiLanguage()]||messages.es;
}
const back=document.getElementById('back');
back.href=profile==='sofia'?`index.html?profile=sofia${params.has('uiLang')?`&uiLang=${encodeURIComponent(params.get('uiLang'))}`:''}`:`idiomas.html?lang=en&profile=${encodeURIComponent(profile)}`;
back.addEventListener('click',event=>{
  const previous=document.referrer;
  if(previous){
    const source=new URL(previous);
    const fromIndex=source.pathname===new URL('index.html',location.href).pathname;
    const fromEnglishArea=source.pathname===new URL('idiomas.html',location.href).pathname&&source.searchParams.get('lang')==='en';
    if(source.origin===location.origin&&((profile==='sofia'&&fromIndex)||(profile!=='sofia'&&fromEnglishArea))){
      event.preventDefault();
      history.back();
    }
  }
});
function clearSpeechTimers(){
  window.clearTimeout(closeTimer);
  window.clearTimeout(speechWatchdog);
  if(voiceWaitCancel)voiceWaitCancel();
  window.clearTimeout(voiceWaitTimer);
}
function scheduleCloseAfterSpeech(){
  window.clearTimeout(closeTimer);
  closeTimer=window.setTimeout(closePicture,2000);
}
function preferredVoice(synthesis,language){
  const voices=synthesis.getVoices().filter(voice=>(voice.lang||'').toLowerCase()===language.toLowerCase());
  const rank=voice=>{
    const name=(voice.name||'').toLowerCase();
    if(/google uk english female/.test(name))return 0;
    if(/\b(sonia|libby|serena|hazel)\b/.test(name))return 1;
    if(/\bfemale\b/.test(name))return 2;
    if(/\b(natural|online)\b/.test(name))return 3;
    return 4;
  };
  return voices.sort((a,b)=>rank(a)-rank(b))[0]||null;
}
function waitForVoice(synthesis,language){
  const available=preferredVoice(synthesis,language);
  if(available)return Promise.resolve(available);
  const voices=synthesis.getVoices();
  if(voices.length&&language==='es-ES')return Promise.resolve(null);
  return new Promise(resolve=>{
    let finished=false;
    const previousHandler=synthesis.onvoiceschanged;
    const fallbackHandler=event=>{
      if(typeof previousHandler==='function')previousHandler.call(synthesis,event);
      handleVoicesChanged();
    };
    const finish=voice=>{
      if(finished)return;
      finished=true;
      window.clearTimeout(voiceWaitTimer);
      if(synthesis.removeEventListener)synthesis.removeEventListener('voiceschanged',handleVoicesChanged);
      else if(synthesis.onvoiceschanged===fallbackHandler)synthesis.onvoiceschanged=previousHandler||null;
      voiceWaitCancel=null;
      resolve(voice);
    };
    const handleVoicesChanged=()=>{
      const voice=preferredVoice(synthesis,language);
      if(voice)finish(voice);
    };
    voiceWaitCancel=()=>finish(null);
    if(synthesis.addEventListener)synthesis.addEventListener('voiceschanged',handleVoicesChanged);
    else synthesis.onvoiceschanged=fallbackHandler;
    if(!finished)voiceWaitTimer=window.setTimeout(()=>finish(preferredVoice(synthesis,language)),1800);
  });
}
async function speakWithSynthesis(word){
  const request=++speechRequest;
  clearSpeechTimers();
  const synthesis=window.speechSynthesis;
  const language=currentVoiceLanguage();
  if(!synthesis||typeof window.SpeechSynthesisUtterance!=='function'){
    speechStatus.textContent=speechText().error;
    scheduleCloseAfterSpeech();
    return;
  }
  try{synthesis.cancel()}catch(error){console.error('No se pudo cancelar la locución anterior:',error)}
  speechStatus.textContent=speechText().searching;
  let voice;
  try{
    voice=await waitForVoice(synthesis,language);
    if(request!==speechRequest||reveal.hidden)return;
  }catch(error){
    console.error('No se pudo buscar una voz:',error);
    if(request!==speechRequest||reveal.hidden)return;
  }
  if(currentVoiceLanguage()==='en-GB'&&!voice){
    speechStatus.textContent=speechText().error;
    scheduleCloseAfterSpeech();
    return;
  }
  let utterance;
  try{
    utterance=new SpeechSynthesisUtterance(word);
    utterance.lang=language;
    if(voice)utterance.voice=voice;
    utterance.rate=.82;
  }catch(error){
    console.error('No se pudo preparar la locución:',error);
    speechStatus.textContent=speechText().error;
    scheduleCloseAfterSpeech();
    return;
  }
  speechStatus.textContent=speechText().playing;
  const speechFinished=()=>{
    if(request!==speechRequest||reveal.hidden)return;
    window.clearTimeout(speechWatchdog);
    speechRequest++;
    speechStatus.textContent=speechText().done;
    scheduleCloseAfterSpeech();
  };
  const speechFailed=message=>{
    if(request!==speechRequest||reveal.hidden)return;
    window.clearTimeout(speechWatchdog);
    speechRequest++;
    speechStatus.textContent=message;
    scheduleCloseAfterSpeech();
  };
  utterance.onend=speechFinished;
  utterance.onerror=()=>speechFailed(speechText().error);
  speechWatchdog=window.setTimeout(()=>speechFailed(speechText().error),8000);
  try{synthesis.speak(utterance)}catch(error){
    console.error('No se pudo iniciar la locución:',error);
    speechFailed(speechText().error);
  }
}
function closePicture(){
  clearSpeechTimers();
  stopVoiceAudio();
  speechRequest++;
  reveal.hidden=true;
  if('speechSynthesis' in window){
    try{window.speechSynthesis.cancel()}catch(error){console.error('No se pudo cancelar la locución al cerrar la imagen:',error)}
  }
}
function addCreditLink(parent,url,label){
  const link=document.createElement('a');
  link.href=url;
  link.target='_blank';
  link.rel='noopener noreferrer';
  link.textContent=label;
  parent.appendChild(link);
}
function appendCreditsHeading(text){
  const heading=document.createElement('h3');
  heading.textContent=text;
  creditsContent.appendChild(heading);
  const list=document.createElement('ul');
  creditsContent.appendChild(list);
  return list;
}
function renderCredits(spanishItems,englishItems){
  creditsContent.replaceChildren();
  const groups=[
    {title:'Abecedario en español',items:spanishItems,language:'es'},
    {title:'English alphabet',items:englishItems,language:'en'}
  ];
  groups.forEach(group=>{
    const list=appendCreditsHeading(group.title);
    group.items.forEach(item=>{
      const row=document.createElement('li');
      const itemName=item.word.charAt(0).toLocaleUpperCase(group.language==='en'?'en-GB':'es-ES')+item.word.slice(1);
      addCreditLink(row,item.source,`${itemName} · ${item.author}`);
      row.appendChild(document.createTextNode(` · ${item.license}`));
      if(item.licenseUrl){
        row.appendChild(document.createTextNode(' · '));
        addCreditLink(row,item.licenseUrl,'Ver licencia');
      }
      list.appendChild(row);
    });
  });
}
async function loadAlphabet(){
  const request=++loadRequest;
  closePicture();
  announcement.textContent='';
  const uiLanguage=currentUiLanguage();
  const wordLanguage=uiLanguage==='en'?'en':'es';
  const languageLabels=labels[uiLanguage]||labels.es;
  activeAlphabet=alphabet[wordLanguage];
  letters.setAttribute('aria-busy','true');
  letters.innerHTML=activeAlphabet.map(letter=>`<button class="letter" type="button" aria-label="${languageLabels.letter} ${letter}" disabled>${letter}</button>`).join('');
  try{
    const responses=await Promise.all([
      fetch('imagenes/abecedario/creditos.json'),
      fetch('imagenes/abecedario/creditos-en.json')
    ]);
    if(responses.some(response=>!response.ok))throw new Error('No se pudieron cargar las fotografías.');
    const [spanishItems,englishItems]=await Promise.all(responses.map(response=>response.json()));
    const items=wordLanguage==='en'?englishItems:spanishItems;
    const byLetter=new Map(items.map(item=>[item.letter,item]));
    if(items.length!==activeAlphabet.length||byLetter.size!==activeAlphabet.length||activeAlphabet.some(letter=>!byLetter.has(letter)))throw new Error('El álbum de fotos está incompleto.');
    if(spanishItems.length!==27||englishItems.length!==26)throw new Error('Los créditos de los alfabetos están incompletos.');
    if(request!==loadRequest)return;
    currentItem=null;
    letters.innerHTML=activeAlphabet.map(letter=>`<button class="letter" type="button" data-letter="${letter}" aria-label="${languageLabels.letter} ${letter}">${letter}</button>`).join('');
    letters.setAttribute('aria-busy','false');
    renderCredits(spanishItems,englishItems);
    window.alphabetPhotos=byLetter;
  }catch(error){
    if(request!==loadRequest)return;
    letters.setAttribute('aria-busy','false');
    letters.innerHTML='';
    document.querySelector('.foot').textContent='No se pudieron cargar las fotos locales. Intenta actualizar la página.';
    console.error(error);
  }
}
function showPicture(letter){
  const item=window.alphabetPhotos&&window.alphabetPhotos.get(letter);
  if(!item)return;
  currentItem=item;
  const word=item.word;
  const language=currentUiLanguage();
  const text=labels[language]||labels.es;
  closePicture();
  letterLabel.textContent=`${letter} ${text.for}`;
  image.src=item.image;
  image.alt=`${text.photo} ${word}`;
  name.textContent=word.charAt(0).toLocaleUpperCase(language==='en'?'en-GB':'es-ES')+word.slice(1);
  announcement.textContent=language==='en'?`${letter} for ${name.textContent}`:language==='de'?`Buchstabe ${letter}: ${name.textContent}`:language==='ca'?`Lletra ${letter}: ${name.textContent}`:`${letter} de ${name.textContent.toLocaleLowerCase('es-ES')}`;
  speechStatus.textContent='';
  reveal.hidden=false;
  playItemAudio(item);
}
letters.addEventListener('click',event=>{
  const button=event.target.closest('button[data-letter]');
  if(button)showPicture(button.dataset.letter);
});
document.getElementById('close').addEventListener('click',closePicture);
document.getElementById('sayAgain').addEventListener('click',()=>{if(currentItem)playItemAudio(currentItem)});
reveal.addEventListener('click',event=>{if(event.target===reveal)closePicture()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!reveal.hidden)closePicture()});
creditsButton.addEventListener('click',()=>{
  if(!creditsContent.hidden)return;
  creditsActivations++;
  if(creditsActivations===5){
    creditsContent.hidden=false;
    creditsButton.setAttribute('aria-expanded','true');
    creditsStatus.textContent='Créditos disponibles.';
  }
});
document.addEventListener('pointerdown',event=>{
  if(!creditsButton.contains(event.target))creditsActivations=0;
},true);
document.addEventListener('click',event=>{
  if(!creditsButton.contains(event.target))creditsActivations=0;
},true);
document.addEventListener('keydown',event=>{
  if(event.target!==creditsButton||!['Enter',' '].includes(event.key))creditsActivations=0;
},true);
window.addEventListener('mundo:ui-language',()=>{
  updateCreditsHint();
  loadAlphabet();
});
updateCreditsHint();
loadAlphabet();
</script>
</body>
</html>
