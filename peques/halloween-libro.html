<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="auth-guard.js"></script>
<title>Halloween: libro para leer</title>
<style>
:root{--ink:#f7f1e8;--paper:#fffaf0;--accent:#ff9b28}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#120b1f;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
.wrap{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.title{font-size:clamp(1rem,2.4vw,1.5rem);font-weight:900;color:#ffe7b8}
.counter{font-size:.9rem;opacity:.85}
.book{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0;align-items:stretch}
.page{background:linear-gradient(180deg,#fffaf0,#f3ead7);color:#2b1d3a;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px #0008;display:grid;min-height:0}
.page.image{place-items:center;background:#0a0612}.page.image img{max-width:100%;max-height:100%;object-fit:contain}
.page.text{padding:clamp(14px,3vw,34px);align-content:center;text-align:center}
.page.text h2{margin:0 0 12px;font-size:clamp(1.2rem,3vw,2rem);color:#523726}
.page.text p{margin:0;font-size:clamp(1rem,2.2vw,1.5rem);line-height:1.55}
.cover h2{font-size:clamp(1.8rem,4vw,3rem)}.cover p{font-size:clamp(1rem,2vw,1.3rem);opacity:.8}
.arrow{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:2rem;line-height:1;cursor:pointer;z-index:20;box-shadow:0 4px 14px #0007}
.arrow.left{left:8px}.arrow.right{right:8px}.arrow:disabled{opacity:.25;cursor:default}
@media(max-width:760px){.book{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.arrow{width:44px;height:44px;font-size:1.6rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="title">🎃 Once Upon a Halloween</span><span class="counter" id="counter"></span></div>
  <div class="book">
    <section class="page image" aria-label="Imagen de la página"><img id="pageImage" src="" alt=""></section>
    <section class="page text" aria-live="polite"><h2 id="pageTitle"></h2><p id="pageText"></p></section>
  </div>
</div>
<button class="arrow left" id="prevBtn" aria-label="Página anterior">‹</button>
<button class="arrow right" id="nextBtn" aria-label="Página siguiente">›</button>
<script>
const pages=[
 {cover:true,title:"Once Upon a Halloween",image:"imagenes/halloween-book/img1.jpg",text:"Un cuento ilustrado para leer en familia."},
 {title:"La bruja",image:"imagenes/halloween-book/img3.jpg",text:"A witch took a walk in the forest one day; What she would see no one could say."},
 {title:"Fantasmas",image:"imagenes/halloween-book/img4.jpg",text:"She saw some ghosts learning to fly; As she went by, she said hi, hi!"},
 {title:"Duende y calabaza",image:"imagenes/halloween-book/img5.jpg",text:"She saw an elf in a pumpkin so sweet; Pumpkins are to eat not a seat!"},
 {title:"Osito perdido",image:"imagenes/halloween-book/img6.jpg",text:"She saw a lost baby bear, who she took into her care; While she looked for her mother, of course no other!"},
 {title:"¿Niño o reno?",image:"imagenes/halloween-book/img8.jpg",text:"Is that a boy or reindeer? He has antlers in his hair."},
 {title:"Conejo y zanahoria",image:"imagenes/halloween-book/img11.jpg",text:"Was the bunny quite bad? Or is the carrot just mad?"},
 {title:"Gato y murciélago",image:"imagenes/halloween-book/img12.jpg",text:"A cat and a bat; Just fancy that."},
 {title:"Ratón y escoba",image:"imagenes/halloween-book/img13.jpg",text:"A mouse on a broom; He can go zoom zoom!"},
 {title:"La bruja se duerme",image:"imagenes/halloween-book/img14.jpg",text:"Now the witch oh so creepy; Was getting ever so sleepy"},
 {title:"Buenas noches",image:"imagenes/halloween-book/img16.jpg",text:"With the end in sight; We must all sleep tight; As the moon says good night..."}
];
let index=0;
const img=document.getElementById("pageImage"),title=document.getElementById("pageTitle"),text=document.getElementById("pageText"),counter=document.getElementById("counter"),prev=document.getElementById("prevBtn"),next=document.getElementById("nextBtn");
function render(){const p=pages[index];img.src=p.image;img.alt=p.title;title.textContent=p.title;text.textContent=p.text;counter.textContent="Página "+(index+1)+" de "+pages.length;prev.disabled=index===0;next.disabled=index===pages.length-1;if(p.cover){title.parentElement.classList.add("cover")}else{title.parentElement.classList.remove("cover")}}
prev.onclick=()=>{if(index>0){index--;render();}};
next.onclick=()=>{if(index<pages.length-1){index++;render();}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")prev.click();if(e.key==="ArrowRight")next.click();});
render();
</script><script src="ui-language.js"></script></body></html>
